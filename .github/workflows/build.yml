name: Build AN758x U-Boot

on:
  push:
    branches:
      - cs
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动运行时创建的 Release Tag（留空则只构建不发布）'
        required: false
        default: ''
      release_name:
        description: 'Release 标题（留空则使用 Tag 名）'
        required: false
        default: ''
      release_type:
        description: '发布类型（仅手动运行时生效）'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release
      build_targets:
        description: '构建机型：逗号分隔，如 hm2004-du,hg5382a,xg2010g；填 all 或留空则构建全部'
        required: false
        default: 'all'
      release_notes:
        description: '更新内容（What''s Changed），可留空自动生成；每行一条，例如：Add xxx support by @user in #2'
        required: false
        default: ''

permissions:
  contents: read
jobs:
  # 计算本次要构建的机型：手动运行按输入过滤，其余事件构建全部
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.value }}
      targets_display: ${{ steps.targets.outputs.display }}
    steps:
      - name: Resolve build targets
        id: targets
        env:
          INPUT_TARGETS: ${{ github.event.inputs.build_targets }}
        run: |
          set -euo pipefail
          ALL_TARGETS="hm2004-du hg5382a hg5585f-ct hg5585f-cu xg2010g zn504xg-d zn515xg-d ung00a xg-040g-md xg-040g-tf xg-040g-mf"

          # 逗号 / 空格 / 分号 / 换行 / 字面 \n 都当作分隔符
          RAW="$(printf '%s' "$INPUT_TARGETS" | tr -d '\r' | sed 's/\\n/\n/g; s/[,;]/\n/g; s/[[:space:]]\+/\n/g')"

          SELECTED=""
          INVALID=""
          for t in $RAW; do
            case "$t" in
              all|ALL|All|'') continue ;;
            esac
            ok=0
            for a in $ALL_TARGETS; do
              [ "$t" = "$a" ] && ok=1
            done
            if [ "$ok" = "1" ]; then
              # 去重，避免同一个机型重复构建
              case " $SELECTED " in
                *" $t "*) ;;
                *) SELECTED="$SELECTED $t" ;;
              esac
            else
              INVALID="$INVALID $t"
            fi
          done

          if [ -n "$INVALID" ]; then
            echo "::error::未知的机型:$INVALID"
            echo "::error::可选机型:$ALL_TARGETS"
            exit 1
          fi

          # 留空 / 填 all → 全部机型
          if [ -z "$SELECTED" ]; then
            SELECTED="$ALL_TARGETS"
          fi

          JSON=""
          DISPLAY=""
          for t in $SELECTED; do
            JSON="$JSON${JSON:+,}\"$t\""
            DISPLAY="$DISPLAY${DISPLAY:+, }$t"
          done

          echo "value=[$JSON]" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "本次构建机型: $DISPLAY"
          {
            echo "### 构建机型"
            echo ""
            echo "$DISPLAY" | tr ',' '\n' | sed 's/^[[:space:]]*/* /'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison ca-certificates curl device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-none-eabi libssl-dev \
            python3 python3-pyelftools swig
      - name: Download Mbed TLS
        run: |
          curl -L https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.4.1.tar.gz |
            tar -xz
          echo "MBEDTLS_DIR=$PWD/mbedtls-3.4.1" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.target }}
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          ARM32_CROSS_COMPILE: arm-none-eabi-
          BUILD_JOBS: 4
          AIROHA_SIGN_KEY: ${{ secrets.AIROHA_SIGN_KEY }}
        run: ./scripts/build-an758x.sh "${{ matrix.target }}"
      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: an758x-${{ matrix.target }}
          path: output/${{ matrix.target }}/an75*
          if-no-files-found: error

  release:
    # push（分支更新 / tag push）或手动运行且填写了 release_tag 时执行；PR 只构建不发布
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      # 仓库更新（分支 push）自动构建使用的滚动 Tag，可在仓库 Settings → Variables 里改
      AUTO_RELEASE_TAG: ${{ vars.AUTO_RELEASE_TAG || 'nightly' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: an758x-*
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -lh release/

      - name: Determine release metadata
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          AUTO_TAG: ${{ vars.AUTO_RELEASE_TAG || 'nightly' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # 手动运行：发布类型由输入决定
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ github.event.inputs.release_name }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.release_type }}" = "release" ]; then
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "label=正式发布" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "label=测试发布（手动）" >> "$GITHUB_OUTPUT"
            fi
            echo "trigger=手动运行" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            # 自动构建：tag push，一律按测试发布
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "label=测试发布（自动构建）" >> "$GITHUB_OUTPUT"
            echo "trigger=Tag 推送（$REF_NAME）" >> "$GITHUB_OUTPUT"
          else
            # 自动构建：仓库更新（分支 push），一律按测试发布，使用滚动 Tag
            echo "name=$AUTO_TAG" >> "$GITHUB_OUTPUT"
            echo "title=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "label=测试发布（自动构建）" >> "$GITHUB_OUTPUT"
            echo "trigger=仓库更新（$REF_NAME 分支）" >> "$GITHUB_OUTPUT"
          fi

      # 仓库更新场景：滚动 Tag 需要先删除旧的 Release 与 Tag，再指向本次 Commit
      - name: Prepare rolling tag
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "删除旧的自动构建 Release: $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push --delete origin "refs/tags/$TAG" || true
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Build release title
        id: title
        env:
          INPUT_TITLE: ${{ steps.meta.outputs.title }}
          LABEL: ${{ steps.meta.outputs.label }}
          TAG: ${{ steps.meta.outputs.name }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            TITLE="$TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TITLE="[自动构建] $TAG"
          else
            TITLE="[自动构建] $TAG（最新仓库状态）"
          fi
          # 测试发布统一加前缀，便于在 Release 列表里一眼区分
          case "$LABEL" in
            测试发布*) TITLE="[测试] $TITLE" ;;
          esac
          echo "value=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release 标题: $TITLE"
          echo "发布类型: $LABEL"

      # 自动生成 What's Changed：手动填写优先，否则从上次发布以来的 PR 生成
      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_NOTES: ${{ github.event.inputs.release_notes }}
          CURRENT_TAG: ${{ steps.meta.outputs.name }}
          IS_ROLLING: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          set -e
          NOTES_FILE="changelog.md"
          : > "$NOTES_FILE"

          # 1) 手动填写的更新内容
          if [ -n "$MANUAL_NOTES" ]; then
            {
              echo "## What's Changed"
              echo ""
              # 支持换行 / 字面 \n / 分号 三种分隔方式，统一渲染成列表
              printf '%s' "$MANUAL_NOTES" \
                | sed 's/\\n/\n/g; s/;\s*/\n/g' \
                | sed '/^[[:space:]]*$/d; s/^[[:space:]]*[*+-]\?[[:space:]]*/* /; s/^\* \* /* /'
            } >> "$NOTES_FILE"
            echo "使用手动填写的更新内容"
          else
            # 2) 自动从 PR 生成：找到上一个 Tag 作为起点
            PREV_TAG="$(git tag --sort=-creatordate | grep -v -x "$CURRENT_TAG" | head -1 || true)"
            if [ -n "$PREV_TAG" ] && [ "$IS_ROLLING" != "true" ]; then
              RANGE="$PREV_TAG..HEAD"
            elif [ -n "$PREV_TAG" ]; then
              # 滚动 Tag：以上一个正式 Tag 为起点，展示全部未发布改动
              RANGE="$PREV_TAG..HEAD"
            else
              RANGE="HEAD"
            fi

            echo "对比范围: ${PREV_TAG:-（全部历史）}..HEAD"

            # 提取区间内 merge commit 对应的 PR 编号（去重、保持顺序）
            PR_LIST="$(git log $RANGE --merges --pretty=format:'%s' 2>/dev/null \
              | grep -oE 'Merge pull request #[0-9]+' \
              | grep -oE '[0-9]+' | awk '!seen[$0]++' || true)"

            if [ -n "$PR_LIST" ]; then
              {
                echo "## What's Changed"
                echo ""
              } >> "$NOTES_FILE"
              for PR in $PR_LIST; do
                INFO="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
                  --json title,author \
                  --template "{{.title}} by @{{.author.login}} in #$PR" 2>/dev/null || true)"
                if [ -n "$INFO" ]; then
                  echo "* $INFO" >> "$NOTES_FILE"
                else
                  echo "* #$PR" >> "$NOTES_FILE"
                fi
              done
            else
              # 没有 merge commit（例如 squash 合并）时退回 commit 列表
              {
                echo "## What's Changed"
                echo ""
                git log $RANGE --no-merges --pretty=format:'* %s by @%an' 2>/dev/null || true
              } >> "$NOTES_FILE"
            fi

            # 完整变更对比链接
            if [ -n "$PREV_TAG" ]; then
              {
                echo ""
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$CURRENT_TAG"
              } >> "$NOTES_FILE"
            fi
          fi

          # 3) 追加构建信息
          {
            echo ""
            echo "## 构建信息"
            echo ""
            echo "- 发布类型：**${{ steps.meta.outputs.label }}**"
            echo "- 触发方式：${{ steps.meta.outputs.trigger }}"
            echo "- 构建机型：${{ needs.prepare.outputs.targets_display }}"
            echo "- Commit：\`${{ github.sha }}\`"
            echo "- 构建任务：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$NOTES_FILE"

          echo "----- changelog -----"
          cat "$NOTES_FILE"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.name }}"
          TITLE="${{ steps.title.outputs.value }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          NOTES="changelog.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets and notes..."
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi

          # 已存在的 Release 也同步更新正文，保证 What's Changed 与本次构建一致
          gh release edit "$TAG" --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"

          # 统一设置 prerelease 标记（新建和已存在两种情况都覆盖）
          gh release edit "$TAG" \
            --title "$TITLE" \
            --prerelease="$PRERELEASE" \
            --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          {
            echo "### Release 结果"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.name }}\`"
            echo "- 标题: ${{ steps.title.outputs.value }}"
            echo "- 发布类型: ${{ steps.meta.outputs.label }}"
            echo "- 触发方式: ${{ steps.meta.outputs.trigger }}"
            echo "- 构建机型: ${{ needs.prepare.outputs.targets_display }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Pre-release: \`${{ steps.meta.outputs.prerelease }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
